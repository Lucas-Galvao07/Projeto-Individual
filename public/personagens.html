<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Personagens-style.css">
    <title>Personagens</title>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <div class="nav-logo">GOH</div>
            <div class="nav-links">
                <a href="index.html#Inicio" class="nav-ativo">Home</a>
                <a href="index.html#Sobre">Sobre</a>
                <a href="personagens.html" class="nav-logado">Personagens</a>
                <a href="login.html" class="nav-login" id="login">Entrar</a>
                <a href="cadastro.html" class="nav-cadastro" id="cadastro">Cadastrar</a>
                <a href="dashboard.html" class="nav-logado" id="dash">Dashboard</a>
                <a href="jogo.html" class="nav-logado" id="jogo">Jogo</a>
            </div>
        </div>
    </nav>


    <div class="container-personagens">

        <div class="header-personagens" id="inicio">
            <h1>Personagens</h1>
        </div>

        <div class="descricao-personagens">
            <h3>
                Salve seus personagens favoritos para usá-los em combate.
            </h3>
        </div>

        <div id="containerPersonagens" class="grid-personagens">
            <!-- personagens vêm do banco via JS -->
        </div>

    </div>
</body>

<script>

    var idUsuario = sessionStorage.getItem("ID_USUARIO")

    if (idUsuario == undefined) {
        jogo.style.display = 'none'
        dash.style.display = 'none'
    }

    if (idUsuario >= 1) {
        login.style.display = 'none'
        cadastro.style.display = 'none'
    }

    function buscarPersonagens() {
        fetch("/personagens")
            .then((resposta) => resposta.json())
            .then((personagens) => {

                var container = document.getElementById("containerPersonagens");
                container.innerHTML = "";

                personagens.forEach((personagem) => {
                    container.innerHTML += `
                    <div class="card-personagem">
                        <img src="${personagem.Imagem}" class="img-personagem" alt="${personagem.Personagem}">
                        <h2 class="nome-personagem">${personagem.Personagem}</h2>
                        <p class="poder-personagem">${personagem.Poder}</p>
                        <div class="acoes-personagem">
                            <button class="btn-favoritar" onclick="favoritar(${personagem.id})">Favoritar⭐</button>
                        </div>
                    </div>
                `;
                });

            })
            .catch((erro) => {
                console.error("Erro ao buscar personagens:", erro);
            });
    }

    function favoritar(idPersonagem) {
        var idUsuario = sessionStorage.getItem("ID_USUARIO");

        if (!idUsuario) {
            alert("Você precisa estar logado para favoritar!");
            window.location.href = "login.html";
            return;
        }

        fetch(`/personagens/${idPersonagem}/favoritar/${idUsuario}`, {
            method: "POST"
        })
            .then((res) => res.json())
            .then(() => alert("Personagem favoritado!"))
            .catch((erro) => console.error("Erro ao favoritar:", erro));
    }

    buscarPersonagens();
</script>

</html>

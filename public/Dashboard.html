<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Dashboard-style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Dashboard</title>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <div class="nav-logo">GOH</div>
            <div class="nav-links">
                <a href="index.html#Inicio" class="nav-ativo">Home</a>
                <a href="index.html#Sobre">Sobre</a>
                <a href="login.html" class="nav-login">Entrar</a>
                <a href="cadastro.html" class="nav-cadastro">Cadastrar</a>
                <a href="personagens.html" class="nav-logado">Personagens</a>
                <a href="dashboard.html" class="nav-logado">Dashboard</a>
            </div>
        </div>
    </nav>


    <div class="dashboard-container">

        <aside class="sidebar">
            <img id="imgPersonagem">
            <h3 id="nomePersonagem">Bem-Vindo <b>NOME</b></h3>
            <button onclick="mostrarDashboard()">Dashboard</button>
            <button onclick="mostrarFavoritos()">Personagens Favoritos</button>
        </aside>

        <section class="dashboard" id="dashboard">

            <div class="kpis">
                <div class="kpi-card">
                    <h4>Vitórias</h4>
                    <span id="vitorias">0</span>
                </div>

                <div class="kpi-card">
                    <h4>Derrotas</h4>
                    <span id="derrotas">0</span>
                </div>
            </div>

            <div class="ranking">
                <h4>Ranking</h4>
                <p>Pontuação: <span id="pontuacao">0</span></p>

                <div class="barra">
                    <div id="progresso"></div>
                </div>

                <p id="winrate">Winrate: 0%</p>
            </div>

        </section>

        <section class="favoritos" id="favoritos">
            ainda em design

            <!-- Aqui vai ficar os cards de personagens favoritos que serão puxados do banco -->
        </section>
    </div>

</body>

<script>
    function mostrarFavoritos() {
        dashboard.style.display = 'none';
        favoritos.style.display = 'block';
    }

    function mostrarDashboard() {
        dashboard.style.display = 'block';
        favoritos.style.display = 'none';
    }

</script>

</html>

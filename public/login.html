<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="CSS/Login-Cadastro-style.css">
    <title>Login</title>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <div class="nav-logo">GOH</div>
            <div class="nav-links">
                <a href="index.html#Inicio" class="nav-ativo">Home</a>
                <a href="index.html#Sobre">Sobre</a>
                <a href="personagens.html" class="nav-logado">Personagens</a>
                <a href="login.html" class="nav-login">Entrar</a>
                <a href="cadastro.html" class="nav-cadastro">Cadastrar</a>
                <a href="dashboard.html" class="nav-logado" id="dash">Dashboard</a>
                <a href="jogo.html" class="nav-logado" id="jogo">Jogo</a>
            </div>
        </div>
    </nav>

    <div id="div_cadastro" class="box">
        <div class="esquerda-login"></div>

        <div class="direita">
            <h1>Login</h1>

            <div class="input_box">
                <span>Email</span>
                <input type="text" id="email_input" placeholder="seuemail@gmail.com">
            </div>

            <div class="input_box">
                <span>Senha</span>
                <input type="password" id="senha_input" placeholder="••••••••">
            </div>

            <button onclick="entrar()">Logar</button>

            <div id="cardErro"></div>
            <div id="cardCerto"></div>
        </div>
    </div>
</body>

<script>
    var idUsuario = sessionStorage.getItem("ID_USUARIO")
    jogo.style.display = 'none'
    dash.style.display = 'none'

    if (idUsuario >= 1) {
        window.location = 'dashboard.html'
    }
    function mostrarErro(mensagem) {
        cardErro.textContent = mensagem;
        cardErro.style.display = 'block';
        setTimeout(() => cardErro.style.display = 'none', 3000);
    }

    function mostrarCerto(mensagem) {
        cardCerto.textContent = mensagem;
        cardCerto.style.display = 'block';
        setTimeout(() => cardCerto.style.display = 'none', 3000);
    }

    function entrar() {
        var email = email_input.value.trim();
        var senha = senha_input.value.trim();

        if (email == '' || senha == '') {
            mostrarErro('Preencha todos os campos!');
            return;
        }

        if (!email.includes('@') || !email.includes('.')) {
            mostrarErro('Email inválido!');
            return;
        }

        if (senha.length < 6) {
            mostrarErro('A senha deve ter pelo menos 6 caracteres!');
            return;
        }

        fetch('/usuarios/autenticar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ emailServer: email, senhaServer: senha })
        })
            .then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (dados) {
                        sessionStorage.EMAIL_USUARIO = dados.email;
                        sessionStorage.NOME_USUARIO = dados.nome;
                        sessionStorage.ID_USUARIO = dados.id;
                        mostrarCerto('Login realizado! Redirecionando...');
                        setTimeout(() => window.location = 'dashboard.html', 1500);
                    });
                } else {
                    mostrarErro('Email ou senha inválidos!');
                }
            })
            .catch(function () {
                mostrarErro('Erro de conexão. Tente novamente.');
            });
    }
</script>

</html>

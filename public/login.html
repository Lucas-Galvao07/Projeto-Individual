<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="CSS/Login-Cadastro-style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">

    <title>Login</title>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <div class="nav-logo">GOH</div>
            <div class="nav-links">
                <a href="index.html#Inicio" class="nav-ativo">Home</a>
                <a href="index.html#Sobre">Sobre</a>
                <a href="login.html" class="nav-login">Entrar</a>
                <a href="cadastro.html" class="nav-cadastro">Cadastrar</a>
                <a href="personagens.html" class="nav-logado">Personagens</a>
                <a href="dashboard.html" class="nav-logado">Dashboard</a>
            </div>
        </div>
    </nav>

    <div id="div_cadastro" class="box">

        <div class="esquerda-login"></div>

        <div class="direita">
            <h1>Login</h1>

            <div class="input_box">
                <span>Email</span>
                <input type="text" id="email_input" placeholder="seuemail@gmail.com">
            </div>

            <div class="input_box">
                <span>Senha</span>
                <input type="password" id="senha_input" placeholder="••••••••">
            </div>

            <button onclick="entrar()">Logar</button>
        </div>

        <div id="cardErro" class="card-erro"></div>

    </div>
</body>

<script>


    function entrar() {
        // aguardar();

        var emailVar = email_input.value.trim();
        var senhaVar = senha_input.value.trim();

        // validação campos vazios
        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Preencha todos os campos!";
            console.log("Preencha todos os campos!")
            return false;
        }

        // validação básica de email
        if (!emailVar.includes("@") || !emailVar.includes(".")) {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Email inválido!";
            console.log("Email inválido!")
            return false;
        }

        // validação tamanho da senha
        if (senhaVar.length < 6) {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Senha deve ter pelo menos 6 caracteres!";
            console.log("Senha deve ter pelo menos 6 caracteres!")
            return false;
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "index.html";
                    }, 1000);
                });

            } else {
                cardErro.style.display = "block"
                mensagem_erro.innerHTML = "Email ou senha inválidos!";
                console.log("Email ou senha inválidos!")

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
</script>

</html>

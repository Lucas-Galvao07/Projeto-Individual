<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="CSS/Login-Cadastro-style.css"/>
  <title>Cadastrar</title>
</head>

<body>
  <nav class="navbar">
    <div class="container nav-content">
      <div class="nav-logo"><img src="assets/imgs/Logo.png"></div>
      <div class="nav-links">
        <a href="index.html#Inicio" class="nav-ativo">Home</a>
        <a href="index.html#Sobre">Sobre</a>
        <a href="personagens.html" class="nav-logado">Personagens</a>
        <a href="login.html" class="nav-login" id="login">Entrar</a>
        <a href="cadastro.html" class="nav-cadastro" id="cadastro">Cadastrar</a>
        <a href="dashboard.html" class="nav-logado" id="dash">Dashboard</a>
        <a href="jogo.html" class="nav-logado" id="jogo">Jogo</a>
      </div>
    </div>
  </nav>

  <div id="div_cadastro" class="box">
    <div class="esquerda-cadastro"></div>

    <div class="direita">
      <h1>Cadastro</h1>

      <div class="input_box">
        <span>Nome</span>
        <input type="text" id="nome_input" placeholder="Ex: Jin Mori" />
      </div>

      <div class="input_box">
        <span>Email</span>
        <input type="text" id="email_input" placeholder="seuemail@gmail.com" />
      </div>

      <div class="input_box">
        <span>Senha</span>
        <input type="password" id="senha_input" placeholder="••••••••" />
      </div>

      <div class="input_box">
        <span>Confirmar senha</span>
        <input type="password" id="confirmacao_senha_input" placeholder="••••••••" />
      </div>

      <button onclick="cadastrar()">Cadastrar</button>

      <div id="cardErro" class="card-erro"></div>
      <div id="cardCerto" class="cardCerto"></div>
    </div>
  </div>
</body>

<script>

  var idUsuario = sessionStorage.getItem("ID_USUARIO")
  jogo.style.display = 'none'
  dash.style.display = 'none'

  if (idUsuario >= 1) {
    window.location = 'dashboard.html'
  }

  function mostrarErro(mensagem) {
    cardErro.textContent = mensagem;
    cardErro.style.display = "block";
    setTimeout(() => (cardErro.style.display = "none"), 3000);
  }

  function mostrarCerto(mensagem) {
    cardCerto.textContent = mensagem;
    cardCerto.style.display = "block";
    setTimeout(() => (cardCerto.style.display = "none"), 3000);
  }
  function cadastrar() {
    var nome = nome_input.value.trim();
    var email = email_input.value.trim();
    var senha = senha_input.value.trim();
    var confirma = confirmacao_senha_input.value.trim();

    if (nome == "" || email == "" || senha == "" || confirma == "") {
      mostrarErro("Preencha todos os campos!");
      return;
    }

    if (nome.length < 3) {
      mostrarErro("Nome muito curto!");
      return;
    }

    if (!email.includes("@") || !email.includes(".")) {
      mostrarErro("Email inválido!");
      return;
    }

    if (senha.length < 6) {
      mostrarErro("A senha deve ter pelo menos 6 caracteres!");
      return;
    }

    if (senha != confirma) {
      mostrarErro("As senhas não coincidem!");
      return;
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nomeServer: nome,
        emailServer: email,
        senhaServer: senha,
      }),
    })
      .then(function (resposta) {
        if (resposta.ok) {
          mostrarCerto("Cadastro realizado! Redirecionando...");
          setTimeout(() => (window.location = "login.html"), 2000);
        } else {
          mostrarErro("Erro ao cadastrar. Tente novamente.");
        }
      })
      .catch(function () {
        mostrarErro("Erro de conexão. Tente novamente.");
      });
  }
</script>

</html>

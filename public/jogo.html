<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/jogo.css">
    <link rel="icon" type="image/x-icon" href="./assets/icon/Logo.ico">
    <title>GOH - Torneio</title>
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <div class="nav-logo"><img src="assets/imgs/Logo.png"></div>
            <div class="nav_links">
                <a href="index.html#Inicio" class="nav-ativo">Home</a>
                <a href="index.html#Sobre">Sobre</a>
                <a href="personagens.html" class="nav-logado">Personagens</a>
                <a href="login.html" class="nav-login" id="login">Entrar</a>
                <a href="cadastro.html" class="nav-cadastro" id="cadastro">Cadastrar</a>
                <a href="dashboard.html" class="nav-logado" id="dash">Dashboard</a>
                <a href="jogo.html" class="nav-logado" id="jogo">Jogo</a>
            </div>
        </div>
    </nav>

    <div class="arena">
        <div class="card" id="card_jogador">
            <h2 id="nome_jogador">Lucas</h2>
            <div class="foto_container" id="foto_jogador"></div>
            <p class="hp_texto" id="hp_texto_jogador">HP: 600</p>
            <div class="hp_barra_container">
                <div class="hp_barra" id="hp_barra_jogador" style="width:100%"></div>
            </div>
        </div>

        <span class="vs">VS</span>

        <div class="card" id="card_inimigo">
            <h2 id="nome_inimigo">???</h2>
            <div class="foto_container" id="foto_inimigo">💀</div>
            <p class="hp_texto" id="hp_texto_inimigo">HP: ???</p>
            <div class="hp_barra_container">
                <div class="hp_barra" id="hp_barra_inimigo" style="width:100%"></div>
            </div>
        </div>
    </div>

    <div class="ataques" id="div_ataques"></div>
    <div class="log" id="log"></div>
    <div id="div_resultado" class="resultado_overlay">
        <div class="resultado_card">
            <p id="resultado_mensagem"></p>
            <button onclick="window.location.reload()">🔄 Jogar Novamente</button>
        </div>
    </div>

</body>

<script>
    var idUsuario = sessionStorage.getItem("ID_USUARIO");
    var idPersonagem = sessionStorage.getItem("personagemSelecionado");

    if (idUsuario == undefined) {
        window.location = 'login.html'
    }
    if (idUsuario >= 1) {
        login.style.display = 'none'
        cadastro.style.display = 'none'
    }

    var vitorias_rodada = 0;

    const HP_MAX = 600;
    let vida_jogador = HP_MAX;
    let fase_atual = 0;
    let jogo_ativo = true;
    let inimigo_atual;
    let ataques = [];
    const cooldowns = {};
    const btns_ataque = {};

    const hpJogadorTexto = document.getElementById('hp_texto_jogador');
    const hpJogadorBarra = document.getElementById('hp_barra_jogador');
    const nomeInimigo = document.getElementById('nome_inimigo');
    const fotoInimigo = document.getElementById('foto_inimigo');
    const hpInimigoTexto = document.getElementById('hp_texto_inimigo');
    const hpInimigoBarra = document.getElementById('hp_barra_inimigo');
    const divAtaques = document.getElementById('div_ataques');
    const log = document.getElementById('log');
    const divResultado = document.getElementById('div_resultado');

    const inimigos = [
        { nome: 'Mira Yoo', vida: 250, vida_max: 250, foto: 'assets/imgs/Mira-Inimigo.jpg' },
        { nome: 'Han Daewi', vida: 350, vida_max: 350, foto: 'assets/imgs/Daewi-Inimigo.jpg' },
        { nome: 'Jegal Taek', vida: 500, vida_max: 500, foto: 'assets/imgs/Jegal-Inimigo.jpg' },
        { nome: 'Park Il-Pyo', vida: 650, vida_max: 650, foto: 'assets/imgs/IlPyo-Inimigo.jpg' },
        { nome: 'Jin Mori', vida: 800, vida_max: 800, foto: 'assets/imgs/Jin-Inimigo.jpg' }
    ];

    fetch(`/jogo/personagem/${idPersonagem}`)
        .then((res) => res.json())
        .then((dados) => {
            document.getElementById("nome_jogador").textContent = dados[0].Personagem;
            foto_jogador.innerHTML = `<img src="${dados[0].Imagem}">`

            var ataquesMap = {};
            dados.forEach((linha) => {
                if (!ataquesMap[linha.idAtaque]) {
                    ataquesMap[linha.idAtaque] = {
                        nome: linha.Ataque,
                        dano: linha.Dano,
                        cooldown_max: linha.Tipo === 'Básico' ? 0
                            : linha.Tipo === 'Skill Fraca' ? 2
                                : linha.Tipo === 'Skill Forte' ? 3
                                    : 4
                    };
                }
            });

            ataques = Object.values(ataquesMap);
            ataques.forEach((a) => cooldowns[a.nome] = 0);

            mostrar_ataques();
            carregar_inimigo();
            adicionar_log('🥊 O torneio começou! Faça o seu movimento.');
        })
        .catch((erro) => console.error("Erro ao buscar personagem:", erro));

    function registrarVitoria() {
        fetch(`/jogo/${idUsuario}/vitorias`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ quantidade: vitorias_rodada })
        })
            .then(() => console.log(`${vitorias_rodada} vitória(s) registrada(s)!`))
            .catch((erro) => console.error("Erro ao registrar vitórias:", erro));
    }

    function registrarDerrota() {
        fetch(`/jogo/${idUsuario}/derrotas`, { method: "POST" })
            .then(() => console.log("Derrota registrada!"))
            .catch((erro) => console.error("Erro ao registrar derrota:", erro));
    }

    function adicionar_log(texto) {
        log.innerHTML += `<p>${texto}</p>`;
        log.scrollTop = log.scrollHeight;
    }

    function atualizar_barra_hp(barra, vida_atual, vida_max) {
        const porcentagem = Math.max(0, (vida_atual / vida_max) * 100);
        barra.style.width = `${porcentagem}%`;
    }

    function atualizar_btn(ataque) {
        const btn = btns_ataque[ataque.nome];
        if (!btn) return;
        const cd = cooldowns[ataque.nome];
        btn.disabled = cd > 0;
        let badge = btn.querySelector('.cooldown_badge');
        if (cd > 0) {
            if (!badge) {
                badge = document.createElement('span');
                badge.className = 'cooldown_badge';
                btn.appendChild(badge);
            }
            badge.textContent = cd;
        } else if (badge) {
            badge.remove();
        }
    }

    function processar_cooldowns() {
        ataques.forEach((a) => {
            if (cooldowns[a.nome] > 0) cooldowns[a.nome]--;
            atualizar_btn(a);
        });
    }

    function carregar_inimigo() {
        inimigo_atual = { ...inimigos[fase_atual] };
        nomeInimigo.textContent = inimigo_atual.nome;
        fotoInimigo.innerHTML = `<img src="${inimigo_atual.foto}" alt="${inimigo_atual.nome}">`;
        hpInimigoTexto.textContent = `HP: ${inimigo_atual.vida}`;
        atualizar_barra_hp(hpInimigoBarra, inimigo_atual.vida, inimigo_atual.vida_max);
    }

    function mostrar_ataques() {
        divAtaques.innerHTML = '';
        ataques.forEach((ataque) => {
            const btn = document.createElement('button');
            btn.innerHTML = `${ataque.nome} <small>Dano: ${ataque.dano} | CD: ${ataque.cooldown_max} rodadas</small>`;
            btn.onclick = () => atacar(ataque);
            divAtaques.appendChild(btn);
            btns_ataque[ataque.nome] = btn;
        });
    }

    function encerrar_jogo(mensagem, vitoria) {
        jogo_ativo = false;
        document.getElementById('resultado_mensagem').textContent = mensagem;
        divResultado.classList.add('ativo');
        ataques.forEach((a) => { if (btns_ataque[a.nome]) btns_ataque[a.nome].disabled = true; });

        if (vitorias_rodada > 0) {
            registrarVitoria();
        }
        if (!vitoria) {
            registrarDerrota();
        }
    }

    function atacar(ataque) {
        if (!jogo_ativo) return;

        inimigo_atual.vida -= ataque.dano;
        adicionar_log(`⚔️ Você usou <strong>${ataque.nome}</strong> e causou ${ataque.dano} de dano!`);
        hpInimigoTexto.textContent = `HP: ${Math.max(0, inimigo_atual.vida)}`;
        atualizar_barra_hp(hpInimigoBarra, inimigo_atual.vida, inimigo_atual.vida_max);

        if (ataque.cooldown_max > 0) {
            cooldowns[ataque.nome] = ataque.cooldown_max;
            atualizar_btn(ataque);
        }

        if (inimigo_atual.vida <= 0) {
            vitorias_rodada++;
            adicionar_log(`🏆 Você derrotou <strong>${inimigo_atual.nome}</strong>!`);
            fase_atual++;

            if (vida_jogador < HP_MAX) {
                vida_jogador = Math.min(vida_jogador + 60, HP_MAX);
                hpJogadorTexto.textContent = `HP: ${vida_jogador}`;
                atualizar_barra_hp(hpJogadorBarra, vida_jogador, HP_MAX);
            }

            if (fase_atual >= inimigos.length) {
                encerrar_jogo('🏆 VOCÊ VENCEU O TORNEIO!', true);
            } else {
                carregar_inimigo();
                ataques.forEach((a) => { cooldowns[a.nome] = 0; atualizar_btn(a); });
                adicionar_log(`⚡ Fase ${fase_atual + 1}: Novo oponente se aproxima!`);
            }
            return;
        }

        processar_cooldowns();
        let dano_inimigo = 0;

        let atk_inimigo = Math.floor(Math.random() * 3 + 1);

        if (inimigo_atual.nome == 'Mira Yoo') {

            if (atk_inimigo == 1) dano_inimigo = 15;
            if (atk_inimigo == 2) dano_inimigo = 25;
            if (atk_inimigo == 3) dano_inimigo = 35;

        }

        if (inimigo_atual.nome == 'Han Daewi') {

            if (atk_inimigo == 1) dano_inimigo = 20;
            if (atk_inimigo == 2) dano_inimigo = 35;
            if (atk_inimigo == 3) dano_inimigo = 50;

        }

        if (inimigo_atual.nome == 'Jegal Taek') {

            if (atk_inimigo == 1) dano_inimigo = 30;
            if (atk_inimigo == 2) dano_inimigo = 50;
            if (atk_inimigo == 3) dano_inimigo = 70;

        }

        if (inimigo_atual.nome == 'Park Il-Pyo') {

            if (atk_inimigo == 1) dano_inimigo = 40;
            if (atk_inimigo == 2) dano_inimigo = 65;
            if (atk_inimigo == 3) dano_inimigo = 90;

        }

        if (inimigo_atual.nome == 'Jin Mori') {

            if (atk_inimigo == 1) dano_inimigo = 55;
            if (atk_inimigo == 2) dano_inimigo = 80;
            if (atk_inimigo == 3) dano_inimigo = 110;

        }
        vida_jogador -= dano_inimigo;
        hpJogadorTexto.textContent = `HP: ${Math.max(0, vida_jogador)}`;
        atualizar_barra_hp(hpJogadorBarra, vida_jogador, HP_MAX);
        adicionar_log(`💥 ${inimigo_atual.nome} atacou e causou ${dano_inimigo} de dano!`);

        if (vida_jogador <= 0) {
            encerrar_jogo('💀 Fim de jogo! Você perdeu.', false);
        }
    }
</script>

</html>

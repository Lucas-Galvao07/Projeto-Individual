<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Dashboard-style.css">
    <link rel="icon" type="image/x-icon" href="./assets/icon/Logo.ico">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Dashboard</title>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <div class="nav-logo"></div>
            <div class="nav-links">
                <a href="index.html#Inicio" class="nav-ativo">Home</a>
                <a href="index.html#Sobre">Sobre</a>
                <a href="login.html" class="nav-login" id="login">Entrar</a>
                <a href="cadastro.html" class="nav-cadastro" id="cadastro">Cadastrar</a>
                <a href="personagens.html" class="nav-logado">Personagens</a>
                <a href="dashboard.html" class="nav-logado">Dashboard</a>
                <a href="jogo.html" class="nav-logado">Jogo</a>
            </div>
        </div>
    </nav>


    <div class="dashboard-container">

        <aside class="sidebar">
            <img id="imgPersonagem" src="assets/imgs/Logo.png">
            <h3 id="nomePersonagem">Bem-Vindo <b>NOME</b></h3>
            <button onclick="mostrarDashboard()">Dashboard</button>
            <button onclick="mostrarFavoritos()">Personagens Favoritos</button>
            <button onclick="limparSessao()">Sair</button>
        </aside>

        <section class="dashboard" id="dashboard">

            <div class="kpis">
                <div class="kpi-card">
                    <h4>Vitórias</h4>
                    <span id="vitorias">0</span>
                </div>

                <div class="kpi-card">
                    <h4>Derrotas</h4>
                    <span id="derrotas">0</span>
                </div>
            </div>

            <div class="ranking">
                <h4 id="ranque">Ranking: </h4>
                <p>Pontuação: <span id="pontuacao">0</span></p>

                <div class="barra">
                    <div id="progresso"></div>
                </div>

                <p id="winrate">Winrate: 0%</p>
            </div>

            <div class="top5-section">
                <h4>TOP 5 JOGADORES</h4>
                <ul class="top5-list" id="top5-lista">
                    <!-- gerado pelo JS -->
                </ul>
            </div>

        </section>

        <section class="favoritos" id="favoritos">
            <div id="cards-favoritos" class="cards-container">
                <!-- Cards gerados pelo JS -->
            </div>
        </section>
    </div>

</body>

<script>
    var idUsuario = sessionStorage.getItem("ID_USUARIO")
    if (idUsuario == undefined) {
        window.location = 'login.html'
    }
    if (idUsuario >= 1) {
        login.style.display = 'none'
        cadastro.style.display = 'none'
    }

    fetch(`/dashboard/${idUsuario}`)
        .then((res) => res.json())
        .then((dados) => {
            var usuario = dados[0];

            document.getElementById("nomePersonagem").innerHTML =
                "Bem-Vindo <b>" + usuario.Nome + "</b>";

            document.getElementById("vitorias").textContent = usuario.Vitorias;
            document.getElementById("derrotas").textContent = usuario.Derrotas;

            var total = usuario.Vitorias + usuario.Derrotas;
            var winrate = total > 0 ? ((usuario.Vitorias / total) * 100).toFixed(1) : 0;
            var rank = ''
            var pontuacao = usuario.Vitorias * 75 - usuario.Derrotas * 200;
            if (isNaN(pontuacao)) {
                pontuacao = 0
            }
            if (pontuacao <= 200) {
                rank = 'Bronze'
            }
            else if (pontuacao <= 500) {
                rank = 'Prata'
            }
            else if (pontuacao <= 750) {
                rank = 'Ouro'
            }
            else if (pontuacao <= 1000) {
                rank = 'Diamante'
            }
            else if (pontuacao <= 1500) {
                rank = 'Mestre'
            }
            else {
                rank = 'Nirvana'
            }
            document.getElementById("pontuacao").textContent = pontuacao;
            document.getElementById("winrate").textContent = "Winrate: " + winrate + "%";
            document.getElementById("progresso").style.width = winrate + "%";
            ranque.innerHTML += rank
        })
        .catch((erro) => console.error("Erro ao buscar info do usuário:", erro));

    fetch(`/dashboard/${idUsuario}/favoritos`)
        .then((res) => res.json())
        .then((dados) => {
            var personagens = {};
            dados.forEach((linha) => {
                if (!personagens[linha.id]) {
                    personagens[linha.id] = {
                        id: linha.id,
                        nome: linha.Personagem,
                        poder: linha.Poder,
                        imagem: linha.Imagem,
                        ataques: [],
                    };
                }
                personagens[linha.id].ataques.push({
                    nome: linha.Ataque,
                    tipo: linha.Tipo,
                    dano: linha.Dano,
                });
            });

            var container = document.getElementById("cards-favoritos");
            container.innerHTML = "";

            Object.values(personagens).forEach((p) => {
                var ataquesHtml = p.ataques.map((a) => `
                    <li>${a.nome} — <span>${a.tipo} (${a.dano} dmg)</span></li>
                `).join("");

                var card = `
                    <div class="card-personagem">
                        <img src="${p.imagem}" alt="${p.nome}">
                        <h3>${p.nome}</h3>
                        <p class="poder">${p.poder}</p>
                        <ul class="ataques">${ataquesHtml}</ul>
                        <button onclick="selecionarPersonagem(${p.id})">
                            Jogar com ${p.nome}
                        </button>
                    </div>
                `;
                container.innerHTML += card;
            });
        })
        .catch((erro) => console.error("Erro ao buscar favoritos:", erro));

    fetch('/dashboard/top')
        .then((res) => res.json())
        .then((dados) => {
            var lista = document.getElementById('top5-lista');
            var classes = ['primeiro', 'segundo', 'terceiro', 'quarto', 'quinto'];

            dados.forEach((usuario, index) => {
                var total = usuario.vitorias + usuario.derrotas;
                var wr = total > 0 ? ((usuario.vitorias / total) * 100).toFixed(0) : 0;
                var iniciais = usuario.nome.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();

                lista.innerHTML += `
                <li class="top5-item ${classes[index]}">
                    <span class="top5-pos">${index + 1}</span>
                    <div class="top5-avatar">${iniciais}</div>
                    <span class="top5-nome">${usuario.nome}</span>
                    <div class="top5-winrate-bar">
                        <div class="top5-winrate-fill" style="width:${wr}%"></div>
                    </div>
                    <div class="top5-stats">
                        <span class="top5-vitorias">${usuario.vitorias} V</span>
                        <span class="top5-detalhe">${usuario.derrotas} D · ${wr}% WR</span>
                    </div>
                </li>
            `;
            });
        })
        .catch((erro) => console.error('Erro ao buscar top 5:', erro));
    function selecionarPersonagem(idPersonagem) {
        sessionStorage.setItem("personagemSelecionado", idPersonagem);
        window.location.href = "jogo.html";
    }

    function mostrarFavoritos() {
        document.getElementById("dashboard").style.display = "none";
        document.getElementById("favoritos").style.display = "block";
    }

    function mostrarDashboard() {
        document.getElementById("dashboard").style.display = "block";
        document.getElementById("favoritos").style.display = "none";
    }

    function limparSessao() {
        sessionStorage.clear();
        window.location = "../login.html";
    }
</script>

</html>
